[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msc-cali"
version = "0.1.0"
description = "Windows-side eye-to-hand calibration and target transport for the MSc thesis setup."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
realsense = ["pyrealsense2>=2.56.3,<3", "Pillow>=10,<13"]
tracking = ["mediapipe>=0.10.20,<0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".cache/pytest"
